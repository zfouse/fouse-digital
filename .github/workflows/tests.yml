name: Prospecting tests
on:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the isolated small live capacity benchmark
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prospecting/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
  live-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prospecting/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Live discovery and draft-only audit in isolated validation state
        run: python prospecting/run.py --state smoke-state/ledger.json --output smoke-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-validation-${{ github.run_id }}
          path: smoke-reports/
          retention-days: 7
          if-no-files-found: warn
  capacity-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prospecting/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Measure isolated discovery and read-only browser capacity
        run: python -m prospecting.benchmark --output capacity-reports/benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-benchmark-${{ github.run_id }}
          path: capacity-reports/
          retention-days: 7
          if-no-files-found: warn
